name: Auto Blog Publisher

on:
  schedule:
    # Every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  publish-blog:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run auto-blog script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: python scripts/auto-blog.py

      - name: Commit and push if blog was added
        run: |
          git config user.name "Auto Blog Bot"
          git config user.email "bot@technocratsdigimate.com"
          git add lib/blog/posts.ts
          if git diff --staged --quiet; then
            echo "No new blog post generated."
          else
            TITLE=$(git diff --staged lib/blog/posts.ts | grep '^\+.*title:' | head -1 | sed 's/.*title: "//' | sed 's/".*//')
            git commit -m "auto: publish blog — ${TITLE:-new post}"
            git push
            echo "✅ Blog pushed to GitHub — Hostinger will auto-deploy."
          fi
