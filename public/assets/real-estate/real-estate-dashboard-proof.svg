<svg width="1400" height="900" viewBox="0 0 1400 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Real Estate Lead Generation Dashboard</title>
  <desc id="desc">A dark navy and gold dashboard visual showing Leads to Qualified Buyers to Site Visits to Bookings, with CPL range around six to seven dollars and qualitative audit states.</desc>
  <rect width="1400" height="900" rx="34" fill="#05070D"/>
  <rect x="36" y="36" width="1328" height="828" rx="28" fill="#07111F" stroke="#21314A" stroke-width="2"/>
  <circle cx="1140" cy="78" r="210" fill="#D6A84F" opacity="0.08"/>
  <circle cx="162" cy="774" r="250" fill="#D6A84F" opacity="0.06"/>

  <text x="86" y="116" fill="#D6A84F" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="5">REAL ESTATE FUNNEL VISIBILITY</text>
  <text x="86" y="170" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="54" font-weight="700">Property Lead Generation Dashboard</text>
  <text x="88" y="214" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="24">Campaign review visual for lead quality, follow-up, and booking movement.</text>

  <rect x="86" y="268" width="254" height="152" rx="18" fill="#0D1828" stroke="#21314A"/>
