  <text x="116" y="374" fill="#F3D58A" font-family="Arial, sans-serif" font-size="48" font-weight="700">$6-7</text>
  <text x="116" y="404" fill="#94A3B8" font-family="Arial, sans-serif" font-size="18">Campaign visibility preview</text>

  <rect x="374" y="268" width="254" height="152" rx="18" fill="#0D1828" stroke="#21314A"/>
  <text x="404" y="318" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="22">Lead Intent</text>
  <text x="404" y="374" fill="#F3D58A" font-family="Arial, sans-serif" font-size="34" font-weight="700">Needs Review</text>
  <text x="404" y="404" fill="#94A3B8" font-family="Arial, sans-serif" font-size="18">Quality before scaling</text>

  <rect x="662" y="268" width="254" height="152" rx="18" fill="#0D1828" stroke="#21314A"/>
  <text x="692" y="318" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="22">Site Visit Flow</text>
