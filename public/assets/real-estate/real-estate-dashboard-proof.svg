  <rect x="86" y="760" width="1194" height="56" rx="14" fill="#111F33" stroke="#21314A"/>
  <text x="126" y="796" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="22">Audit focus: source clarity, buyer intent, follow-up delay, site visit visibility, and booking readiness.</text>
