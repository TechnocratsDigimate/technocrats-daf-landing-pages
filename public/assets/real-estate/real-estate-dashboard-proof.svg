  <text x="980" y="318" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="22">Booking Readiness</text>
  <text x="980" y="374" fill="#F3D58A" font-family="Arial, sans-serif" font-size="34" font-weight="700">Audit Required</text>
  <text x="980" y="404" fill="#94A3B8" font-family="Arial, sans-serif" font-size="18">Review before scaling</text>

  <rect x="86" y="488" width="1194" height="234" rx="22" fill="#0D1828" stroke="#21314A"/>
